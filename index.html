<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julio Becerra</title>

    <!-- GOOGLE reCAPTCHA v2 -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #1a1a1a;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #0f172a;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 30px;
        }

        .captcha-container {
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

    <h1>JULIO BECERRA</h1>

    <div class="captcha-container">

        <div
            class="g-recaptcha"
            data-sitekey="6LcMPostAAAAAHgKxVJH7mtUoXYsR5nyR4k6Odw5"
            data-callback="captchaCompletado">
        </div>

    </div>

    <script>
        function captchaCompletado(token) {
            window.location.href = "https://cececap.cl/";
        }
    </script>

</body>
</html>
